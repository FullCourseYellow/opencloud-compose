---
services:
  opencloud:
    # Keep public HTTPS URLs while routing container traffic through local Caddy,
    # avoiding external DNS selecting an unreachable IPv6 address.
    extra_hosts:
      - "${EURO_OFFICE_DOMAIN:?Set EURO_OFFICE_DOMAIN}=host-gateway"
    environment:
      # OpenCloud otherwise binds its proxy to loopback, which is unreachable
      # from Caddy on the shared Docker network.
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      # Fail before deployment rather than silently using upstream test values.
      OC_LDAP_BIND_PASSWORD: "${LDAP_BIND_PASSWORD:?Set LDAP_BIND_PASSWORD}"
      OC_OIDC_ISSUER: "${IDP_ISSUER_URL:?Set IDP_ISSUER_URL}"
      IDP_DOMAIN: "${IDP_DOMAIN:?Set IDP_DOMAIN}"
      WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: "${IDP_ACCOUNT_URL:?Set IDP_ACCOUNT_URL}"
    labels:
      caddy: "${OC_DOMAIN:?Set OC_DOMAIN}"
      caddy.import: "${CADDY_ACME_SNIPPET:-dns-acme-fcy}"
      caddy.reverse_proxy: "{{upstreams 9200}}"

      harbordns.hostname: "${OC_DOMAIN:?Set OC_DOMAIN}"
      harbordns.type: A
      harbordns.cloudflare.proxied: "true"
      harbordns.conflict: update
      harbordns.auto-remove: "${HARBORDNS_AUTO_REMOVE:-true}"
      harbordns.cloudflare.comment: OpenCloud
    networks:
      opencloud-net:
      caddy_net:

  euro-office:
    # Route WOPI callbacks through local Caddy without changing their public URL.
    extra_hosts:
      - "${OC_DOMAIN:?Set OC_DOMAIN}=host-gateway"
    environment:
      JWT_SECRET: "${EURO_OFFICE_JWT_SECRET:?Set EURO_OFFICE_JWT_SECRET}"
    labels:
      caddy: "${EURO_OFFICE_DOMAIN:?Set EURO_OFFICE_DOMAIN}"
      caddy.import: "${CADDY_ACME_SNIPPET:-dns-acme-fcy}"
      caddy.reverse_proxy: "{{upstreams 80}}"

      harbordns.hostname: "${EURO_OFFICE_DOMAIN:?Set EURO_OFFICE_DOMAIN}"
      harbordns.type: A
      harbordns.cloudflare.proxied: "true"
      harbordns.conflict: update
      harbordns.auto-remove: "${HARBORDNS_AUTO_REMOVE:-true}"
      harbordns.cloudflare.comment: Euro Office
    networks:
      opencloud-net:
      caddy_net:

  ldap-server:
    environment:
      LDAP_ADMIN_PASSWORD: "${LDAP_BIND_PASSWORD:?Set LDAP_BIND_PASSWORD}"

networks:
  caddy_net:
    external: true
